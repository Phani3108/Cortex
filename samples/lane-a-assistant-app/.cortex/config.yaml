version: 1
project:
  name: lane-a-assistant-app
  language: typescript
  framework: fastify
providers:
  claude: true
  cursor: true
  copilot: true
  gemini: false
  openai: false
  windsurf: false
  antigravity: false
  codex: false
  kiro: false
rules:
  sources:
    - local
skills:
  sources:
    - local
context:
  include:
    - src/
    - openapi.yaml
  exclude:
    - node_modules/
    - dist/
  max_tokens: 100000
