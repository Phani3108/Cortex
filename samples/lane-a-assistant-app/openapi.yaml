openapi: 3.1.0
info:
  title: Lane A Assistant API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
  /assist:
    post:
      summary: Generate an assistant response
      requestBody:
        required: true
      responses:
        '200':
          description: Structured assistant response
        '400':
          description: Invalid request
        '429':
          description: Rate or budget limit exceeded
