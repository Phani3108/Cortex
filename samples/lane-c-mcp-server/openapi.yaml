openapi: 3.1.0
info:
  title: Lane C MCP Server API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
  /mcp/tools/list:
    get:
      summary: List MCP tools
      responses:
        '200':
          description: Tool list
  /mcp/tools/run:
    post:
      summary: Run MCP tool with strict contract
      requestBody:
        required: true
      responses:
        '200':
          description: Tool execution result
        '400':
          description: Invalid tool call
