# Cortex configuration — https://github.com/Phani3108/Cortex
version: 2
project:
  name: lane-c-mcp-server
  language: typescript
  framework: fastify
providers:
  claude: true
  cursor: true
  copilot: true
  gemini: false
  openai: false
  windsurf: false
  antigravity: false
  codex: true
  kiro: false
  gemini-review: false
output:
  agentsMd: shared
  skills: true
rules:
  sources:
    - local
skills:
  sources:
    - local
context:
  include:
    - src/
    - contracts/
    - openapi.yaml
  exclude:
    - node_modules/
    - dist/
  max_tokens: 100000
