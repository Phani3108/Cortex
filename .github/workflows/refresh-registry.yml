name: Refresh model registry

# Keeps registry/latest.json (model pricing + context windows) current.
# Commits only when the data actually changed; Vercel redeploys the site on push.
on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-registry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild registry from OpenRouter
        id: refresh
        run: node scripts/refresh-registry.mjs
      - name: Sanity check
        run: |
          node -e "const r=require('./registry/latest.json'); if (!r.models || Object.keys(r.models).length < 50) { console.error('Registry looks wrong: too few models'); process.exit(1) }"
          npm test
      - name: Commit changes
        run: |
          if git diff --quiet -- registry/latest.json; then
            echo "No model changes today."
            exit 0
          fi
          git config user.name "cortex-registry-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/latest.json
          git commit -m "chore(registry): refresh model data (${{ steps.refresh.outputs.models }} models, ${{ steps.refresh.outputs.changes }} changes)"
          git push
